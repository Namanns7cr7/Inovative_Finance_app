<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vault</title>
  <link rel="stylesheet" href="../styles.css"/>
  <meta http-equiv="refresh" content="1.2; url=../index.html"/>
  <style>
    body{display:grid;place-items:center;padding:1.5rem;}
    .handoff{
      width:min(420px,100%);
      background:var(--panel-wash),var(--surface-container-highest);
      border:1px solid var(--panel-border);
      border-radius:var(--radius-xl);
      padding:2rem;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--shadow-float);
      text-align:center;
    }
    .handoff-mark{
      width:56px;height:56px;
      margin:0 auto 1rem;
      border-radius:var(--radius-lg);
      background:var(--gradient-cta);
      display:flex;align-items:center;justify-content:center;
      color:var(--on-primary);
      box-shadow:0 16px 34px rgba(63,255,139,.18);
    }
    .handoff-bar{
      height:3px;
      margin-top:1.5rem;
      background:rgba(255,255,255,.08);
      border-radius:var(--radius-full);
      overflow:hidden;
    }
    .handoff-bar::before{
      content:'';
      display:block;
      width:100%;
      height:100%;
      background:var(--gradient-cta);
      transform-origin:left;
      animation:loadBar 1.1s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes loadBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
</head>
<body>
  <main class="handoff">
    <div class="handoff-mark">
      <svg width="26" height="26" viewBox="0 0 20 20" fill="none"><rect x="2" y="8" width="7" height="10" rx="1.5" fill="currentColor"/><rect x="11" y="4" width="7" height="14" rx="1.5" fill="currentColor"/><circle cx="5.5" cy="5.5" r="3.5" fill="currentColor"/></svg>
    </div>
    <div class="headline-sm">Opening Vault</div>
    <div class="body-sm mt-2">Taking you to the dashboard.</div>
    <div class="handoff-bar"></div>
    <a class="btn btn-tertiary mt-4" href="../index.html">Go now<svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </main>
</body>
</html>
